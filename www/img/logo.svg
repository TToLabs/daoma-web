<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="petalGrad" cx="50%" cy="100%" r="90%">
    <stop offset="0%" stop-color="#3C5C42"/>
    <stop offset="55%" stop-color="#6B9C4F"/>
    <stop offset="100%" stop-color="#93C171"/>
  </radialGradient>
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#B5793B"/>
    <stop offset="100%" stop-color="#C99753"/>
  </linearGradient>
</defs>

  <!-- Anillo verde oscuro: mayoría izquierda, con punta afinada que se
       cruza por encima del dorado arriba -->
  <path d="M 103 22
           A 78 78 0 1 0 143 173"
        fill="none" stroke="#26382C" stroke-width="12" stroke-linecap="round"/>
  <path d="M 103 22 C 115 24, 126 29, 135 37" fill="none" stroke="#26382C" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Anillo dorado: mayoría derecha, con punta que se cruza por debajo
       del verde abajo -->
  <path d="M 60 20
           A 78 78 0 0 1 163 129"
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 163 129 C 158 140, 150 150, 140 157" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Aguja -->
  <g stroke="#23302A" stroke-linecap="round">
    <circle cx="100" cy="18" r="5.5" fill="#23302A" stroke="none"/>
    <path d="M 94 26 L 100 31 L 106 26" fill="none" stroke-width="2.6"/>
    <line x1="100" y1="30" x2="100" y2="62" stroke-width="6.5"/>
    <line x1="91" y1="36" x2="109" y2="36" stroke-width="2.8"/>
    <line x1="91" y1="42.5" x2="109" y2="42.5" stroke-width="2.8"/>
    <line x1="91" y1="49" x2="109" y2="49" stroke-width="2.8"/>
    <line x1="91" y1="55.5" x2="109" y2="55.5" stroke-width="2.8"/>
    <line x1="100" y1="62" x2="100" y2="176" stroke-width="2.2"/>
  </g>

  <!-- Flor de loto: 7 pétalos separados por un trazo blanco, degradé
       oscuro en la base a claro en las puntas, como el logo oficial -->
  <g stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round">
    <!-- exteriores -->
    <path d="M 100 130 C 78 126, 58 112, 48 90 C 72 88, 94 104, 100 130 Z" fill="url(#petalGrad)"/>
    <path d="M 100 130 C 122 126, 142 112, 152 90 C 128 88, 106 104, 100 130 Z" fill="url(#petalGrad)"/>
    <!-- intermedios -->
    <path d="M 100 128 C 84 118, 70 100, 70 78 C 90 82, 103 104, 100 128 Z" fill="url(#petalGrad)"/>
    <path d="M 100 128 C 116 118, 130 100, 130 78 C 110 82, 97 104, 100 128 Z" fill="url(#petalGrad)"/>
    <!-- internos -->
    <path d="M 100 126 C 89 114, 82 96, 85 76 C 99 84, 105 106, 100 126 Z" fill="url(#petalGrad)"/>
    <path d="M 100 126 C 111 114, 118 96, 115 76 C 101 84, 95 106, 100 126 Z" fill="url(#petalGrad)"/>
    <!-- central, el más alto -->
    <path d="M 100 124 C 94 108, 92 86, 100 64 C 108 86, 106 108, 100 124 Z" fill="url(#petalGrad)"/>
  </g>

  <!-- cáliz / base puntiaguda -->
  <path d="M 84 128 C 92 136, 108 136, 116 128 C 111 142, 89 142, 84 128 Z" fill="#2E4034" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
